<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>All Input Types</h2>
    <form>
        <!-- Name -->
        <label>Enter First Name</label>
        <input type="text" placeholder="Enter name ">
        <br><br>

        <!-- Last Name -->
         <label >Enter Last Name </label>
         <input type="text" placeholder="Enter Last Name">
         <br><br>

         <!-- Email -->
          <label >Enter Email ID</label>
          <input type="email" placeholder="Enter Email ID">
     <br><br>

     <!-- Phone -->
      <label>phone_no</label>
      <input type="number" placeholder="enter your phone_no">
        <br><br>

         <!-- password -->
        <label>Password</label>
        <input type="password">
        <br><br>
        
        <!-- Date -->
        <label>Date of Birthday</label>
        <input type="date">
        <br><br>
        

        <!-- month -->
        <label>Month</label>
        <input type="month">
        <br><br>

        <!-- week -->
        <label>week</label>
        <input type="week" />
        <br><br>
  
        <!-- time -->
        <label>time</label>
        <input type="time" >
        <br><br>

          <!--  date amd time -->
            <label >Date and Time</label>
            <input type="datetime-local">
            <br><br>

            <!--  select color -->
            <label>Select Color</label>
            <input type="color">
            <br><br>
            

            <!-- Select Range -->
            <label>select Range</label>
            <input type="range">
            <br><br>

             <!-- Upload Files -->
            <label>upload files</label>
            <input type="file">
            <br><br>

            <!-- upload multiple files -->
            <label>upload files</label>
            <input type="file" multiple>
            <br><br>
      
            <!-- search -->
            <label>Search</label>
            <input type="search">
            <br><br>
   
            <!-- URL -->
            <label> Enter URL</label>
            <input type="url">
            <br><br>

            <!-- Telephone -->
            <label>Enter Telephone</label>
            <input type="tel"> <br><br>


            <!-- checkbox -->
            <label>Choose Any 2 Cities</label>
            <input type="checkbox" checked>Pune
            <input type="checkbox">Mumbai
            <input type="checkbox">Kolhapur
            <input type="checkbox">Sangali
            <br><br>


            <!-- radio -->
            <label> Select the Gender</label>
            <input type="radio" name="Gender">Male
            <input type="radio" name="Gender">Female
            <input type="radio" name="Gender">other
            <br><br>


            <!-- Select -->
        <label>Choose Color</label>
        <select>
            <option>Choose....</option>
            <option>White</option>
            <option>Red</option>
            <option>Yellow</option>
            <option>Pink</option>
            <option>Blue</option>
         </select>
         <br><br>


         <!-- textarea -->
         <label>Address</label>
         <textarea rows="4" cols="20"></textarea>
         <br><br>


         <!-- Button -->
         <input type="submit" value="submit form">
         <input type="button"  value="submit form">
         <input type="reset" value="Reste form">







    
    </form>
    
</body>
</html>
